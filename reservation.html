<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserve a Table - Delicious Bites</title>
<link rel="stylesheet" href="styles.css">
<style>
body { font-family: Arial, sans-serif; padding: 20px; background: #f7f7f7; }
h1 { color: #007BFF; text-align: center; margin-bottom: 30px; }
form { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);}
label { display: block; margin-top: 15px; font-weight: bold; }
input, textarea, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; }
button { background: #007BFF; color: white; border: none; cursor: pointer; transition: 0.3s; }
button:hover { background: #0056b3; }
</style>
</head>
<body>
<h1>Reserve a Table</h1>
<form method="POST" action="reservation_process.php">
    <label for="name">Name:</label>
    <input type="text" name="name" id="name" required>

    <label for="email">Email:</label>
    <input type="email" name="email" id="email" required>

    <label for="phone">Phone:</label>
    <input type="tel" name="phone" id="phone" required>

    <label for="res_date">Reservation Date:</label>
    <input type="date" name="res_date" id="res_date" required>

    <label for="res_time">Reservation Time:</label>
    <input type="time" name="res_time" id="res_time" required>

    <label for="guests">Number of Guests:</label>
    <input type="number" name="guests" id="guests" min="1" required>

    <label for="message">Message (Optional):</label>
    <textarea name="message" id="message" rows="4"></textarea>

    <button type="submit">Book Now</button>
</form>
</body>
</html>
